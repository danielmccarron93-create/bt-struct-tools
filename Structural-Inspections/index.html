<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#00aaec" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="BT Inspect" />
  <meta name="description" content="Bligh Tanner site inspection reports — mobile-first, offline-capable." />

  <title>BT Inspection Report</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/icon-maskable.svg" />

  <!-- Libre Franklin: free web equivalent of Franklin Gothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <a class="skip-link" href="#app-main">Skip to content</a>

  <!-- App shell -->
  <div class="app" id="app">
    <header class="app-header" id="app-header"></header>

    <main class="app-main" id="app-main" tabindex="-1">
      <!-- Views mount here via the router -->
      <div id="view-outlet"></div>
    </main>

    <nav class="app-nav" id="app-nav" aria-label="Primary">
      <a class="app-nav__item" href="#/home" data-route="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1Z"/></svg>
        <span>Home</span>
      </a>
      <a class="app-nav__item" href="#/projects" data-route="projects">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
        <span>Projects</span>
      </a>
      <a class="app-nav__item" href="#/inspections" data-route="inspections">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2h8l4 4v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6Zm0 8h8M8 14h8M8 18h5"/></svg>
        <span>Inspections</span>
      </a>
      <a class="app-nav__item" href="#/rectifications" data-route="rectifications">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Rectifications</span>
      </a>
      <a class="app-nav__item" href="#/settings" data-route="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15-.6 1 1.4 2.2-2 2-2.2-1.4-1 .6-.6 2.6h-2.8l-.6-2.6-1-.6-2.2 1.4-2-2L5.8 16l-.6-1-2.6-.6v-2.8l2.6-.6.6-1-1.4-2.2 2-2 2.2 1.4 1-.6.6-2.6h2.8l.6 2.6 1 .6 2.2-1.4 2 2L18.2 9l.6 1 2.6.6v2.8Z"/></svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>

  <!-- Loading state shown before JS boots -->
  <div class="boot" id="boot">
    <div class="boot__logo" aria-hidden="true">
      <span class="boot__blue">BLIGH</span>
      <span class="boot__grey">TANNER</span>
    </div>
    <div class="boot__sub">Inspection Report</div>
  </div>

  <!-- Dexie (IndexedDB wrapper) -->
  <script src="https://unpkg.com/dexie@4.0.8/dist/dexie.min.js"></script>

  <!-- PDF.js (drawing renderer) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Worker path for PDF.js — must be set before any getDocument() call
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <!-- jsPDF (report generation, Phase 6) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- QR code generator (V2 close-out workflow) — exposes window.qrcode -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

  <!-- JSZip (V2 export bundle) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- App entry — version query forces module cache busting on upgrades -->
  <script type="module" src="js/app.js?v=2.2.1-standard-checks"></script>
</body>
</html>
